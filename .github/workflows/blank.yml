
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q priyo_ponno_online_android_project.zip -d extracted
          WRAPPER=$(find extracted -name gradlew -type f | head -n 1)
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.9-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Priyo-Shop-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
